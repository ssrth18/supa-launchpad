<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" rx="45" fill="#4f46e5"/>
  
  <!-- Launch arrow icon -->
  <g transform="translate(96, 96)">
    <!-- Rocket body -->
    <rect x="-20" y="-40" width="40" height="60" rx="8" fill="white"/>
    
    <!-- Rocket nose -->
    <path d="M -20 -40 L 0 -60 L 20 -40 Z" fill="white"/>
    
    <!-- Rocket window -->
    <circle cx="0" cy="-20" r="8" fill="#4f46e5"/>
    
    <!-- Left fin -->
    <path d="M -20 10 L -35 30 L -20 25 Z" fill="white"/>
    
    <!-- Right fin -->
    <path d="M 20 10 L 35 30 L 20 25 Z" fill="white"/>
    
    <!-- Flame -->
    <path d="M -12 25 L -8 45 L 0 35 L 8 45 L 12 25 Z" fill="#ff9800"/>
  </g>
</svg>
